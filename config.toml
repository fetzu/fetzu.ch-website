baseurl                  = "https://fetzu.ch/"           # Your domain name
locale                   = "en-us"                       # Was languageCode | deprecated in Hugo 0.158
defaultContentLanguage   = "en"
title                    = "fetzu dot ch: palace of the meh"
theme                    = ["hugo-cloak-email", "sam"]
# googleAnalytics        = ""                               # Tracking code, eg. "UA-111111111-1"
#enableGitInfo            = true

[params]
    dateform             = "Mon 02 Jan, 2006"
    dateformshort        = "02 Jan"
    dateformFooter       = "02 Jan 2006"
    dateformfull         = "Mon 2 Jan 2006 15:04:05"
    favicon              = "favicon.ico"
    homepage             = "home"                           # What to call the home page link, link will not be rendered if empty
    footerCopyright      = '&#183; <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>'

# Metadata for Open Graph and Twitter
    description          = "Julien 'fetzu' Bono's other website."               # Max 160 characters show in search results
    #images               = ["tn.png"]                       # Image that shows on Twitter cards and Open Graph links to the site
    title                = "fetzu dot ch"
    # rss                = ""

[[params.videoBackground.sources]]
    #source  = "/static/bg-videos"
    type    = "video/mp4"
    poster  = "/background.png"
[params.videoBackground]
    overlay = "rgba(0, 0, 0, 0.4)" # optional

[[params.mainMenu]]
    link = "blog"
    text = "blog"

[[params.mainMenu]]
    link = "https://console.fetzu.ch/"
    text = "console"

[[params.mainMenu]]
    link = "portfolio"
    text = "portfolio"

[[params.mainMenu]]
    link = "about"
    text = "who is fetzu?"

[markup.goldmark.renderer]
    unsafe = true                                       # Keep inline HTML instead of silently dropping it

[markup.highlight]
    style = "friendly"                                  # Was pygmentsStyle | https://xyproto.github.io/splash/docs/all.html
    codeFences = true                                   # Was pygmentsCodefences

[imaging]
    quality = 75

[params.author]
    name = "Julien 'fetzu' Bono"                        # Was [author] | .Site.Author left with Hugo 0.155ish

[frontmatter]
    lastmod = ['date', ':fileModTime']

# NOTE: the old custom [outputFormats.Sitemap] made four pages race for /sitemap.xml;
# the built-in sitemap (rendered through layouts/_default/sitemap.xml) does the job alone.

[outputs]
    home = ["HTML", "RSS"]
    section = ["HTML", "RSS"]                           # RSS so /blog/index.xml (the feed the footer links to) actually exists
    taxonomy = ["HTML"]
    term = ["HTML"]
